server:
  port: 8082
  tomcat:
    threads:
      max: 20 # 允许的最大线程数
    accept-count: 20 # 最大排队等待数量
    max-connections: 100 # 允许的最大连接
feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true # 开启feign对sentinel的支持
hm:
  db:
    database: hm-cart
    host: 192.168.31.128
    un: root
    port: 3307
    pw: 123
  swagger:
    title: "黑马商城购物车接口文档"
    package: com.hmall.cart.controller
    desc: "黑马商城购物车接口文档"
spring:
  application:
    name: cart-service
  config:
    location: classpath:/bootstrap.yml

